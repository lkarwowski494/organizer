# E2E na symulatorze iOS (D143): Maestro przechodzi scenariusze .maestro/ na buildzie z EXPO_PUBLIC_E2E=1 (atrapy
# w pamięci zamiast Supabase — src/app/e2e.ts), robi zrzuty ekranu i porównuje je z wzorcami (.maestro/baselines/).
# Przy każdej zmianie (push na main, PR) i co noc; w nocy (i przy ręcznym uruchomieniu) różnica zrzutów oblewa przebieg,
# przy push/PR jest tylko w podsumowaniu. Opis: docs/testing.md.
#
# Koszty: standardowe runnery macOS w repo publicznym są bez opłat (D143, https://docs.github.com/en/billing/concepts/product-billing/github-actions);
# nie używamy płatnych „larger runners”.
# Bezpieczeństwo: tylko pull_request (nigdy pull_request_target), akcje przypięte do pełnego SHA, token tylko do odczytu,
# żadnych sekretów ani środowisk (build symulatora nie jest podpisywany i nie łączy się z serwerem).
# Decyzja właściciela 8.10.2026 (audyt 2, M-79, PW-48 A): zadanie macOS tylko dla push na main, harmonogramu, ręcznego
# uruchomienia i PR z tego repozytorium (PR z forka sprawdza tylko składnię scenariuszy); artefakt to wyłącznie zrzuty
# ekranu (z obrazami różnic) i koniec logu xcodebuild — bez pełnego logu, logów Maestro i bez aplikacji (.app); 7 dni nocą
# i ręcznie, 2 dni przy push i PR (audyt 3, N-106).
# Warianty zrzutów (PWD-38 B, audyt 2 M-307): 2 telefony × 2 tryby kolorów × 2 rozmiary tekstu (scripts/e2e/run-matrix.sh);
# przy push i PR tylko wariant bazowy (szybka informacja), nocą i ręcznie wszystkie 8. Audyt dostępności XCUITest na każdym
# ekranie (D186, audyt 2 M-153, scripts/e2e/a11y-audit.sh) — jak różnice zrzutów: nocą i ręcznie oblewa przebieg.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 2 * * *' # 4:37 czasu polskiego latem, po nightly.yml (cron GitHuba działa w UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  # Audyt 2 (D-3): na main trwający przebieg dobiega końca (przerywany przy każdym pushu nie kończył się nigdy);
  # czeka najwyżej jeden następny — GitHub: „By default, any existing pending job or workflow in the same concurrency
  # group will be canceled” (https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency).
  # W PR nowszy commit przerywa starszy przebieg.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flows-syntax:
    # Składnia scenariuszy na Linuksie (szybko, przed kilkudziesięcioma minutami na macOS).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - run: scripts/e2e/install-maestro.sh
      - run: scripts/e2e/check-flows.sh

  ios:
    needs: flows-syntax
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Wersja Xcode przypięta jak w ios-release.yml (obraz macos-26: Xcode 26.6; SDK 57 wymaga Xcode ≥ 26.4).
    # Audyt 2 (M-48): gdy GitHub nie przydzieli maszyny w ok. 15 min, zadanie kończy się adnotacją „The job was not
    # acquired by Runner of type hosted even after multiple attempts” (8.10.2026 15:21–17:35 UTC trzy razy; standardowa
    # pula arm64 ma stałą adnotację „Due to capacity constraints…”). To brak maszyny, nie błąd testów: ponów ręcznie.
    runs-on: macos-26
    # Build ok. 25 min + ok. 6–8 min na wariant (8 wariantów nocą).
    timeout-minutes: 150
    env:
      # Telefon wariantu bazowego (pierwszy w scripts/e2e/run-matrix.sh): build i audyt dostępności.
      E2E_DEVICE: iPhone 17e
      E2E_VARIANTS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'all' || 'base' }}
      E2E_STRICT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      # Wyniki robocze (logi Maestro, raport porównania) poza katalogiem artefaktu; do e2e-artifacts/ trafia tylko to,
      # co publikujemy (krok „artefakt”).
      E2E_OUT: ${{ github.workspace }}/e2e-work
      E2E_APP: ios/build/e2e/Build/Products/Release-iphonesimulator/Organizer.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: symulator
        id: sim
        run: |
          scripts/e2e/boot-simulator.sh
          mkdir -p "$E2E_OUT"
      - name: build symulatora (EXPO_PUBLIC_E2E=1)
        # Flaga ustawiana tylko tutaj (i w scripts/e2e/build-ios.sh); test kontraktowy src/app/__tests__/e2e-flag.test.ts.
        env:
          EXPO_PUBLIC_E2E: '1'
        run: scripts/e2e/build-ios.sh "${{ steps.sim.outputs.udid }}"
      - run: scripts/e2e/install-maestro.sh
      - name: scenariusze Maestro we wariantach zrzutów
        # Porażka scenariuszy w wariancie bazowym oblewa krok; w pozostałych — krok porównania (nocą).
        run: scripts/e2e/run-matrix.sh "$E2E_APP" "$E2E_OUT" "$E2E_VARIANTS"
      - name: porównanie zrzutów z wzorcami
        if: ${{ !cancelled() }}
        run: |
          args=()
          if [ "$E2E_STRICT" = "true" ]; then args+=(--fail); fi
          status=0
          while read -r v; do
            node scripts/e2e/compare-screenshots.mjs --name "$v" --baselines ".maestro/baselines/$v" --actual "$E2E_OUT/$v/screenshots" --out "$E2E_OUT/diff/$v" "${args[@]}" || status=1
          done < "$E2E_OUT/variants.txt"
          if [ -s "$E2E_OUT/variants-failed.txt" ]; then
            echo "::warning::Scenariusze nie przeszły w wariantach: $(tr '\n' ' ' < "$E2E_OUT/variants-failed.txt")"
            if [ "$E2E_STRICT" = "true" ]; then status=1; fi
          fi
          exit "$status"
      - name: audyt dostępności na symulatorze (XCUITest)
        if: ${{ !cancelled() }}
        run: |
          udid="$(scripts/e2e/boot-simulator.sh "$E2E_DEVICE" | tail -n 1)"
          xcrun simctl ui "$udid" content_size large
          args=()
          if [ "$E2E_STRICT" = "true" ]; then args+=(--fail); fi
          scripts/e2e/a11y-audit.sh "$udid" "$E2E_OUT/a11y" "${args[@]}"
      - name: artefakt (tylko zrzuty i koniec logu)
        if: ${{ !cancelled() }}
        # Zrzuty scenariuszy, obrazy różnic, zrzuty z chwili błędu Maestro, opis symulatora (dla e2e:accept) i ostatnie
        # 200 wierszy logu xcodebuild bez wierszy `export` (zmienne środowiska buildu z faz skryptów).
        run: |
          mkdir -p e2e-artifacts/screenshots e2e-artifacts/diff e2e-artifacts/failures e2e-artifacts/devices
          while read -r v; do
            mkdir -p "e2e-artifacts/screenshots/$v" "e2e-artifacts/diff/$v" "e2e-artifacts/failures/$v"
            find "$E2E_OUT/$v/screenshots" -maxdepth 1 -name '*.png' -exec cp {} "e2e-artifacts/screenshots/$v/" \; 2>/dev/null || true
            find "$E2E_OUT/diff/$v" -maxdepth 1 -name '*.diff.png' -exec cp {} "e2e-artifacts/diff/$v/" \; 2>/dev/null || true
            find "$E2E_OUT/$v/maestro" -name '*.png' ! -name '[0-9][0-9]-*.png' -exec cp {} "e2e-artifacts/failures/$v/" \; 2>/dev/null || true
            cp "$E2E_OUT/device-$v.txt" "e2e-artifacts/devices/$v.txt" 2>/dev/null || true
          done < "$E2E_OUT/variants.txt" 2>/dev/null || true
          if [ -f ios/build/e2e-xcodebuild.log ]; then
            tail -n 200 ios/build/e2e-xcodebuild.log | grep -v -E '^[[:space:]]*export ' > e2e-artifacts/xcodebuild-tail.txt || true
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-${{ github.run_number }}-${{ github.run_attempt }}
          path: e2e-artifacts/
          # Audyt 3 (N-106): limit artefaktów GitHub Free 500 MB (czy dotyczy repo publicznego — do potwierdzenia,
          # docs/limits.md; pomiar w nightly.yml → free-limits). Nocą i ręcznie 7 dni, przy push i PR 2 dni.
          retention-days: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 7 || 2 }}
          if-no-files-found: warn
