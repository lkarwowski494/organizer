# CI: typy, lint, testy i skan sekretów. Tylko runner Linux (w repo prywatnym minuty macOS liczą się ×10).
# Bezpieczeństwo: wyzwalacz pull_request (forki nie dostają sekretów), akcje przypięte do pełnego SHA,
# token tylko do odczytu. Nie używać pull_request_target.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Audyt 3 (N-84): na main każdy przebieg dobiega końca (przerwany zostawiał commity bez skanu sekretów do nocy);
  # w PR nowszy commit przerywa starszy przebieg.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage -- --ci
      - run: npm run check:functions
      - run: npm run check:corpus
      # Licencje bibliotek na ekranie Ustawienia → Licencje zgodne z prawdziwą paczką iOS (audyt 3, N-78).
      - run: npm run check:licenses
      # Skrypty CI (np. podział i próg testów mutacyjnych) i kontrakty workflow (audyt 2).
      - run: node --test ".github/scripts/*.test.mjs"

  workflows-lint:
    # Składnia i typowe błędy w plikach workflow (także tych, które nie uruchamiają się przy każdej zmianie,
    # np. ios-release). actionlint z instalatora: przypięta wersja z wydania i suma SHA-256 (bez instalacji przez Go,
    # która ściągała nowszy toolchain Go z proxy.golang.org).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/install-actionlint.sh
      - run: actionlint

  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks w przypiętej wersji z sumą SHA-256 (audyt 3, N-258; gitleaks-action pobierał go bez sumy).
      - run: .github/scripts/install-gitleaks.sh
      # Reguły .gitleaks.toml na fałszywych sekretach tworzonych w czasie testu (audyt 2, M-195).
      - name: reguły .gitleaks.toml
        run: .github/scripts/test-gitleaks-rules.sh
      # gitleaks-action skanował przy push tylko pierwszego rodzica bez scaleń — commity scalonej gałęzi przechodziły
      # nieskanowane (audyt 2), a zmiany wniesione w samym scaleniu także w nocnym skanie (audyt 3, N-84). Tu cały zakres
      # pusha (albo PR), ze scaleniami i diffem każdego scalenia; test skryptu na repozytorium tymczasowym.
      - name: test skanu zakresu
        run: .github/scripts/test-gitleaks-range.sh
      - name: skan całego zakresu pusha albo PR
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/gitleaks-range.sh "$BEFORE" "$AFTER"
