# Certyfikaty i profile podpisu iOS przez fastlane match (D28) — zaszyfrowane w prywatnym repozytorium organizer-certs
# (fastlane/Matchfile). Nic nie buduje i nic nie wysyła do TestFlight (to robi ios-release.yml).
# Uruchamiane wyłącznie ręcznie (workflow_dispatch) z wyborem ścieżki fastlane:
#  - bootstrap_signing — jednorazowo: certyfikat dystrybucyjny i profil App Store (zrobione przy starcie projektu;
#    ponownie tylko po wygaśnięciu albo unieważnieniu certyfikatu);
#  - renew_profile — nowy profil App Store po włączeniu nowej możliwości w App ID (np. Associated Domains, D94).
# Środowisko ios-release (bez zatwierdzania — D53, 7.10.2026) dopuszcza tylko gałąź main i tagi v*, więc przebieg
# z innej gałęzi nie dostanie sekretów. Sekrety środowiska (nazwy): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (klucz
# App Store Connect API), MATCH_PASSWORD (hasło szyfrowania match), MATCH_GIT_USER i MATCH_GIT_TOKEN (dostęp do
# organizer-certs; nagłówek Basic liczony w kroku i maskowany). BEZ artefaktów (w repo publicznym może je pobrać każdy
# zalogowany). Runner macos-26 — w repo publicznym bez opłat. Przebieg nie kompiluje aplikacji, więc nie przełącza
# Xcode (xcode-select z przypiętą wersją jest tylko w ios-release.yml).
name: match-bootstrap

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'bootstrap_signing albo renew_profile'
        required: true
        default: bootstrap_signing
        type: choice
        options: [bootstrap_signing, renew_profile]

permissions:
  contents: read

concurrency:
  group: match-bootstrap
  cancel-in-progress: false

jobs:
  signing:
    runs-on: macos-26
    timeout-minutes: 60
    environment: ios-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bundle install
      - name: fastlane ${{ inputs.lane }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_USER: ${{ secrets.MATCH_GIT_USER }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          LANE: ${{ inputs.lane }}
        run: |
          # Nagłówek Basic liczony w kroku i maskowany w logach (dane złożone psują maskowanie sekretów).
          auth=$(printf '%s:%s' "$MATCH_GIT_USER" "$MATCH_GIT_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          MATCH_GIT_BASIC_AUTHORIZATION="$auth" bundle exec fastlane ios "$LANE"
