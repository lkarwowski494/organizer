# Build iOS i wysyłka do TestFlight (D9). Runner macos-26 — w repo publicznym bez opłat.
# Bezpieczeństwo: tylko tag v* albo ręczne uruchomienie; środowisko ios-release z wymaganym zatwierdzeniem
# właściciela (sekrety dostępne dopiero po zatwierdzeniu); BEZ artefaktów (w repo publicznym może je
# pobrać każdy zalogowany). Wersja Xcode przypięta (obraz macos-26: 26.6 domyślny, sprawdzone 7.10.2026
# w actions/runner-images, images/macos/macos-26-arm64-Readme.md; SDK 57 wymaga Xcode ≥ 26.4).
name: ios-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    environment: ios-release
    env:
      # Klucz publikowalny Supabase (jawny z założenia, chroni RLS) — zmienna środowiska ios-release,
      # nie sekret; Expo wkleja EXPO_PUBLIC_* do paczki JS przy budowaniu.
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: klucz Supabase ustawiony
        run: test -n "$EXPO_PUBLIC_SUPABASE_KEY" || { echo "Brak zmiennej SUPABASE_PUBLISHABLE_KEY w środowisku ios-release"; exit 1; }
      # Bramka (D46): pełne szybkie testy na tym commicie, zanim cokolwiek trafi do TestFlight.
      - run: npm run check
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: npx expo prebuild --platform ios --clean
      - run: bundle install
      - name: fastlane release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_USER: ${{ secrets.MATCH_GIT_USER }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Nagłówek Basic liczony w kroku i maskowany w logach (dane złożone psują maskowanie sekretów).
          auth=$(printf '%s:%s' "$MATCH_GIT_USER" "$MATCH_GIT_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          MATCH_GIT_BASIC_AUTHORIZATION="$auth" bundle exec fastlane ios release
