# Nocny pełny zestaw testów (decyzja właściciela 6.10.2026, docs/testing.md): testy mutacyjne,
# pełny skan sekretów w historii, audyt zależności. Tylko runner Linux — w repo publicznym bez opłat.
# Ciężkie testy na symulatorze iOS (E2E, zrzuty ekranu, wydajność): planowane, niezaimplementowane (docs/testing.md).
name: nightly

on:
  schedule:
    - cron: '17 1 * * *' # 3:17 czasu polskiego latem (cron GitHuba działa w UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Próg: co najmniej 90% wykrytych celowych usterek w logice (stryker.config.json → thresholds.break).
      - run: npm run test:mutation

  secrets-full-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Błąd przy każdym NOWYM zgłoszeniu high/critical spoza scripts/audit-baseline.json.
      - run: node scripts/audit-check.mjs
