# Nocny pełny zestaw testów (decyzja właściciela 6.10.2026, docs/testing.md): testy mutacyjne,
# pełny skan sekretów w historii, audyt zależności. Tylko runner Linux — w repo publicznym bez opłat.
# E2E na symulatorze iOS i zrzuty ekranu: osobny workflow e2e.yml (D143); testy bazy co noc: db.yml;
# wydajność — planowana (docs/testing.md).
name: nightly

on:
  schedule:
    - cron: '17 1 * * *' # 3:17 czasu polskiego latem (cron GitHuba działa w UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  mutation-plan:
    # Podział testów mutacyjnych według danych (mutation-plan.mjs; 11.10.2026 przy 18 863 mutantach stałe 8 części
    # przekraczało 110 min): plan Strykera (mutanty statyczne, czas testów każdego mutanta), testy powiązane z każdym
    # plikiem i pomiar z poprzedniego przebiegu (artefakt mutation-timings) dają przewidywany czas; liczba części i limit
    # czasu każdej wynikają z tego przewidywania.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # lista przebiegów nightly i pobranie artefaktu mutation-timings z poprzedniego
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: pomiar z poprzedniego przebiegu
        # Najnowszy zakończony przebieg nightly na tej gałęzi (a gdy go nie ma — na main) z artefaktem mutation-timings.
        # Brak pomiaru nie jest błędem: plan liczy wtedy z samego modelu.
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: .github/scripts/mutation-prev-timings.sh "$BRANCH" reports/previous
      - name: plan części
        id: plan
        run: node .github/scripts/mutation-plan.mjs --timings reports/previous/timings.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-plan
          path: reports/mutation/plan.json
          retention-days: 3
          if-no-files-found: error

  mutation:
    # Części z planu: zakresy `--mutate` (pliki albo grupy mutantów jednego pliku) i limit czasu kroku = SAFETY ×
    # przewidywany czas części (mutation-plan.mjs). Próg liczy zadanie mutation-score na wyniku całości.
    needs: mutation-plan
    name: mutation (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.jobMin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: testy mutacyjne, część ${{ matrix.part }}
        # Po timeout-minutes GitHub oznacza zadanie jako „cancelled” (8.10.2026 przerwany pomiar wyglądał na anulowany,
        # nie na błąd); `timeout` kończy wcześniej z kodem 124, więc przekroczenie czasu oblewa przebieg.
        env:
          MUTATE: ${{ matrix.mutate }}
          STEP_MIN: ${{ matrix.stepMin }}
        run: |
          mkdir -p reports/mutation
          printf '%s\n' "$MUTATE" > reports/mutation/mutate.txt
          timeout --kill-after=2m "${STEP_MIN}m" npx stryker run stryker.shard.config.mjs --mutate "$MUTATE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Także po przekroczeniu czasu: pomiar mutantów, które zdążyły się wykonać, poprawia następny plan.
        if: always()
        with:
          name: mutation-part-${{ matrix.part }}
          path: |
            reports/mutation/mutation.json
            reports/mutation/mutate.txt
            reports/mutation/timings.jsonl
          retention-days: 3
          if-no-files-found: error

  mutation-score:
    # Próg: co najmniej 90% wykrytych celowych usterek w logice (stryker.config.json → thresholds.break), liczony jak
    # w Strykerze na scalonych raportach wszystkich części; sprawdza też, że części objęły każdy mutant z planu dokładnie
    # raz. Rusza także po porażce części, żeby zapisać pomiar czasu dla następnego planu (artefakt mutation-timings).
    needs: [mutation-plan, mutation]
    if: ${{ always() && needs.mutation-plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: reports/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-part-*
          path: reports/parts
      - run: mkdir -p reports/timings && node .github/scripts/mutation-merge.mjs --plan reports/plan/plan.json --timings-out reports/timings/timings.json reports/parts/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-timings
          path: reports/timings/timings.json
          retention-days: 7
          if-no-files-found: error

  secrets-full-history:
    # Audyt 3 (N-84, N-258): ten sam skrypt co w ci.yml, na wszystkich gałęziach i tagach, z diffem każdego scalenia
    # (-m); gitleaks z sumą SHA-256 zamiast gitleaks-action (przy harmonogramie skanował bez scaleń).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: .github/scripts/install-gitleaks.sh
      - name: skan całej historii
        run: .github/scripts/gitleaks-range.sh --all

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Błąd przy każdym NOWYM zgłoszeniu high/critical spoza scripts/audit-baseline.json.
      - run: node scripts/audit-check.mjs

  free-limits:
    # Darmowe limity (D185, audyt 2 M-78): rozmiar bazy i wywołania Edge Functions z Supabase Management API, pamięć
    # podręczna i artefakty Actions; ≥ 70% limitu (progi config.limits) albo nieudany pomiar oblewa zadanie. Zapytanie
    # do bazy co noc podtrzymuje projekt Free przed uśpieniem po tygodniu bez ruchu. Sekret SUPABASE_MONITOR_TOKEN (token
    # z zakresem: tylko ten projekt, tylko odczyt) jest w środowisku `monitor`, które dopuszcza tylko gałąź main
    # (audyt 3, N-85) — przebieg z innej gałęzi go nie dostanie. Bez sekretu: ostrzeżenie, a od
    # config.limits.monitorSecretRequiredFrom błąd (N-83). Sekret tylko w kroku pomiaru, nigdy wypisywany.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: monitor
    permissions:
      contents: read
      actions: read # GET /repos/{owner}/{repo}/actions/cache/usage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: pomiar limitów i podtrzymanie projektu
        env:
          SUPABASE_MONITOR_TOKEN: ${{ secrets.SUPABASE_MONITOR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node --no-warnings .github/scripts/free-limits.mjs
