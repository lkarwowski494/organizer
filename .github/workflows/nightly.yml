# Nocny pełny zestaw testów (decyzja właściciela 6.10.2026, docs/testing.md): testy mutacyjne,
# pełny skan sekretów w historii, audyt zależności. Tylko runner Linux — w repo publicznym bez opłat.
# E2E na symulatorze iOS i zrzuty ekranu: osobny workflow e2e.yml (D143); testy bazy co noc: db.yml;
# wydajność — planowana (docs/testing.md).
name: nightly

on:
  schedule:
    - cron: '17 1 * * *' # 3:17 czasu polskiego latem (cron GitHuba działa w UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  mutation:
    # Audyt 2 (M-47): 8537 mutantów w 64 plikach to kilka godzin pracy jednego runnera (plan Strykera z 8.10.2026:
    # 1512 mutantów statycznych, każdy uruchamia wszystkie powiązane testy), a limit zadania GitHub to 6 h. Pliki
    # dzielone na równoległe części (.github/scripts/mutation-shards.mjs, wzorce mutate ze stryker.config.json);
    # próg liczy zadanie mutation-score na wyniku całości.
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: testy mutacyjne, część ${{ matrix.part }}
        # Po timeout-minutes GitHub oznacza zadanie jako „cancelled” (8.10.2026 przerwany pomiar wyglądał na anulowany,
        # nie na błąd); `timeout` kończy wcześniej z kodem 124, więc przekroczenie czasu oblewa przebieg.
        run: |
          files="$(node .github/scripts/mutation-shards.mjs "${{ strategy.job-index }}" "${{ strategy.job-total }}")"
          mkdir -p reports/mutation
          printf '%s\n' "$files" > reports/mutation/files.txt
          timeout --kill-after=2m 110m npx stryker run stryker.shard.config.mjs --mutate "$files"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-part-${{ matrix.part }}
          path: |
            reports/mutation/mutation.json
            reports/mutation/files.txt
          retention-days: 3
          if-no-files-found: error

  mutation-score:
    # Próg: co najmniej 90% wykrytych celowych usterek w logice (stryker.config.json → thresholds.break), liczony jak
    # w Strykerze na scalonych raportach wszystkich części; sprawdza też, że części objęły każdy plik z `mutate`.
    needs: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-part-*
          path: reports/parts
      - run: node .github/scripts/mutation-merge.mjs reports/parts/*

  secrets-full-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Błąd przy każdym NOWYM zgłoszeniu high/critical spoza scripts/audit-baseline.json.
      - run: node scripts/audit-check.mjs

  free-limits:
    # Darmowe limity (D185, audyt 2 M-78): rozmiar bazy i wywołania Edge Functions z Supabase Management API, pamięć
    # podręczna Actions; ≥ 70% limitu (progi config.limits) albo nieudany pomiar oblewa zadanie. Zapytanie do bazy co noc
    # podtrzymuje projekt Free przed uśpieniem po tygodniu bez ruchu. Sekret SUPABASE_MONITOR_TOKEN dodaje właściciel
    # (docs/limits.md); bez niego nic nie jest mierzone: ostrzeżenie, a od config.LIMITS_MONITOR_TOKEN_REQUIRED_FROM błąd
    # (audyt 3, N-83). Sekret tylko w kroku pomiaru, nigdy wypisywany.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # GET /repos/{owner}/{repo}/actions/cache/usage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: pomiar limitów i podtrzymanie projektu
        env:
          SUPABASE_MONITOR_TOKEN: ${{ secrets.SUPABASE_MONITOR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node --no-warnings .github/scripts/free-limits.mjs
