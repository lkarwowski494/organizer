# Wdrożenie bazy i funkcji do projektu Supabase „organizer” (O-034, decyzja właściciela 7.10.2026: wariant A).
# Tylko ręcznie (workflow_dispatch), w środowisku supabase-prod z wymaganym zatwierdzeniem właściciela —
# sekrety (token CLI, hasło bazy) są dostępne dopiero po zatwierdzeniu. Tryb „dry-run” pokazuje, które
# migracje weszłyby, niczego nie zmieniając; „apply” wgrywa migracje i funkcje delete-account oraz notify-handoff.
# Koszt: darmowy runner Linux (repozytorium publiczne).
name: supabase-deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = tylko pokaż zmiany, apply = wgraj'
        type: choice
        options: [dry-run, apply]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: supabase-prod
    env:
      PROJECT_REF: rkokujgrziaaxabtxnlo
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLI: npx --yes supabase@2.119.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: sekrety ustawione
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Brak sekretu SUPABASE_ACCESS_TOKEN w środowisku supabase-prod"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Brak sekretu SUPABASE_DB_PASSWORD w środowisku supabase-prod"; exit 1; }
      - name: połączenie z projektem
        run: $CLI link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: migracje do wgrania (podgląd)
        run: $CLI db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: wgranie migracji
        if: inputs.mode == 'apply'
        run: $CLI db push --password "$SUPABASE_DB_PASSWORD"
      - name: wgranie funkcji delete-account
        if: inputs.mode == 'apply'
        run: $CLI functions deploy delete-account --project-ref "$PROJECT_REF" --use-api
      # Push o przekazaniach (D70, ADR 0015). Sekrety APNS_* są już w projekcie Supabase (spike S1, ADR 0002).
      - name: wgranie funkcji notify-handoff
        if: inputs.mode == 'apply'
        run: $CLI functions deploy notify-handoff --project-ref "$PROJECT_REF" --use-api
