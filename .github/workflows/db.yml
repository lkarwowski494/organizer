# Testy bazy danych (docs/testing.md): migracje od zera + pgTAP (RLS, synchronizacja, uprawnienia, kontrakty).
# Dwa warianty, oba na darmowych runnerach Linux w repo publicznym:
#  - local:    zwykły Postgres 16 + nakładka scripts/db/supabase-shim.sql (ten sam zestaw co `npm run test:db`),
#              z „otwartymi” uprawnieniami domyślnymi starszych projektów — sprawdza, że migracje same się zamykają;
#  - supabase: prawdziwy stos Supabase CLI (Postgres 17, auth, realtime) — sprawdza zgodność z oryginałem.
# Kiedy: zmiana bazy, testów tests/db albo kodu, który te testy importują (silnik synchronizacji, config — pilnuje tego
# .github/scripts/ci-scripts.test.mjs), zależności npm (pg, fast-check, jest — audyt 3, N-241), co noc na main i ręcznie
# (audyt 2, M-155). Zielony przebieg dla commitu to
# warunek wdrożenia (supabase-deploy.yml) i wydania (ios-release.yml): .github/scripts/require-green-runs.sh.
name: db

on:
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/db/**', 'tests/db/**', 'src/domain/**', 'src/config/**', 'package.json', 'package-lock.json', '.github/workflows/db.yml', '.github/scripts/install-supabase-cli.sh']
  pull_request:
    paths: ['supabase/**', 'scripts/db/**', 'tests/db/**', 'src/domain/**', 'src/config/**', 'package.json', 'package-lock.json', '.github/workflows/db.yml', '.github/scripts/install-supabase-cli.sh']
  schedule:
    - cron: '47 0 * * *' # 2:47 czasu polskiego latem: także bez zmian w ścieżkach (cron GitHuba działa w UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-${{ github.ref }}
  # Na main każdy przebieg dobiega końca — zielony db.yml dla commitu to warunek wdrożenia i wydania (audyt 3, N-84);
  # w PR nowszy commit przerywa starszy przebieg.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Postgres 16 + pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap postgresql-16-cron libtap-parser-sourcehandler-pgtap-perl
          sudo mkdir -p /var/tmp/pg && sudo chown postgres /var/tmp/pg
          sudo -u postgres /usr/lib/postgresql/16/bin/initdb -D /var/tmp/pg -A trust -U postgres >/dev/null
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl -D /var/tmp/pg -o "-p 54329 -k /tmp -c shared_preload_libraries=pg_cron -c cron.database_name=organizer_test" -l /var/tmp/pg/log start
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migracje + pgTAP, potem test różnicowy FakeServer ↔ prawdziwy SQL (tests/db).
      - run: npm run test:db

  supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CLI z wydania GitHuba w przypiętej wersji z sumą SHA-256 (audyt 3, N-255; bez paczki npm i jej zależności).
      - run: .github/scripts/install-supabase-cli.sh
      - name: Supabase (tylko baza, auth i realtime)
        run: supabase start -x studio,imgproxy,storage-api,mailpit,logflare,vector,supavisor,edge-runtime,postgres-meta,kong,postgrest
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
