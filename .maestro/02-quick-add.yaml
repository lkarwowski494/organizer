appId: io.github.lkarwowski494.organizer
name: 02 Szybkie dodanie „Kupić mleko jutro” — zadanie widać jutro
---
- runFlow: common/launch.yaml
- runFlow:
    file: common/type.yaml
    env:
      FIELD: "quick-add"
      TEXT: "Kupić mleko jutro"
- tapOn: "Dodaj"
- runFlow:
    file: common/scroll-tap-text.yaml
    env:
      TEXT: "Następny dzień"
# Przy AX5 sekcja dnia jest pod paskiem okresu, poniżej ekranu (E2E 38208123607).
- scrollUntilVisible:
    element:
      id: "today-day-2026-10-08"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 10
- scrollUntilVisible:
    element: "Kupić mleko,.*"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 10
# Pasek „Dodano … · Zmień” znika po config.UNDO_MS — zrzut bez niego (powtarzalny).
- extendedWaitUntil:
    notVisible:
      id: "undo-bar"
    timeout: 15000
- takeScreenshot: 02-quick-add-tomorrow
