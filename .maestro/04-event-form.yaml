appId: io.github.lkarwowski494.organizer
name: 04 Nowe wydarzenie z formularza — kafelki godzin i minut (TimeField)
---
- runFlow: common/launch.yaml
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: "tab-Calendar"
      SCREEN: "screen-calendar"
# „Dodaj na <dzień>” stoi pod siatką dni (ADR 0049, K3), ale przy AX5 siatka jest wyższa niż ekran, a przycisk bywa za
# paskiem zakładek (iPhone 17 Pro Max, nocny przebieg 38106362581) — przez common/scroll-tap.yaml. Bez centerElement
# (E2E na main od 71abed3).
- runFlow:
    file: common/scroll-tap.yaml
    env:
      ID: "calendar-add-event"
- extendedWaitUntil:
    visible:
      id: "screen-event-edit"
    timeout: 30000
# Pole nazwy ma autoFocus — klawiatura może zasłaniać wybór grupy (AX5); Maestro widzi elementy pod klawiaturą.
- runFlow: common/hide-keyboard.yaml
- scrollUntilVisible:
    element: "Rodzina"
    direction: DOWN
    timeout: 30000
- tapOn: "Rodzina"
- runFlow:
    file: common/type.yaml
    env:
      FIELD: "event-title"
      TEXT: "Wywiadówka"
- runFlow: common/hide-keyboard.yaml
- scrollUntilVisible:
    element:
      id: "event-start-0"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "event-start-0"
- scrollUntilVisible:
    element:
      id: "event-start-0-h-18"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "event-start-0-h-18"
- scrollUntilVisible:
    element:
      id: "event-start-0-m-30"
    direction: DOWN
    timeout: 30000
# Minuta zamyka panel.
- tapOn:
    id: "event-start-0-m-30"
- scrollUntilVisible:
    element:
      id: "event-end-0"
    direction: UP
    timeout: 30000
- tapOn:
    id: "event-end-0"
- scrollUntilVisible:
    element:
      id: "event-end-0-h-19"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "event-end-0-h-19"
- scrollUntilVisible:
    element:
      id: "event-end-0-m-15"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "event-end-0-m-15"
- scrollUntilVisible:
    element:
      id: "event-save"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "event-save"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 30000
# Po zapisie pasek „Cofnij” (treść paska otwiera „Ostatnie zmiany”, D194). Przy AX5 jest wysoki, a przeciągnięcie
# zaczęte i skończone na nim to dotknięcie — E2E 38220289381 (08, iPhone 17 Pro Max): przewijanie w górę otworzyło
# „Ostatnie zmiany”. Przewijamy dopiero, gdy pasek zniknie (config.UNDO_MS), jak w 05.
- extendedWaitUntil:
    notVisible:
      id: "undo-bar"
    timeout: 15000
# Kalendarz zostaje przewinięty do „Dodaj na <dzień>” (pod siatką) — lista dnia z nowym wierszem jest niżej (ADR 0049).
- scrollUntilVisible:
    element: "Wywiadówka, 18:30.*"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 10
- takeScreenshot: 04-event-form
