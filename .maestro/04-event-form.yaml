appId: io.github.lkarwowski494.organizer
name: 04 Nowe wydarzenie z formularza — kafelki godzin i minut (TimeField)
---
- runFlow: common/launch.yaml
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: "tab-Calendar"
      SCREEN: "screen-calendar"
# Przycisk na końcu treści, często za paskiem zakładek (iPhone 17 Pro Max, nocny przebieg 38106362581) — przez
# common/scroll-tap.yaml. Bez centerElement: przycisku na końcu treści nie da się przewinąć do środka ekranu
# (E2E na main od 71abed3).
- runFlow:
    file: common/scroll-tap.yaml
    env:
      ID: "calendar-add-event"
- extendedWaitUntil:
    visible:
      id: "screen-event-edit"
    timeout: 10000
# Pole nazwy ma autoFocus — klawiatura może zasłaniać wybór grupy (AX5); Maestro widzi elementy pod klawiaturą.
- hideKeyboard
- scrollUntilVisible:
    element: "Rodzina"
    direction: DOWN
    timeout: 10000
- tapOn: "Rodzina"
- runFlow:
    file: common/type.yaml
    env:
      FIELD: "event-title"
      TEXT: "Wywiadówka"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "event-start-0"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "event-start-0"
- scrollUntilVisible:
    element:
      id: "event-start-0-h-18"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "event-start-0-h-18"
- scrollUntilVisible:
    element:
      id: "event-start-0-m-30"
    direction: DOWN
    timeout: 10000
# Minuta zamyka panel.
- tapOn:
    id: "event-start-0-m-30"
- scrollUntilVisible:
    element:
      id: "event-end-0"
    direction: UP
    timeout: 10000
- tapOn:
    id: "event-end-0"
- scrollUntilVisible:
    element:
      id: "event-end-0-h-19"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "event-end-0-h-19"
- scrollUntilVisible:
    element:
      id: "event-end-0-m-15"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "event-end-0-m-15"
- scrollUntilVisible:
    element:
      id: "event-save"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "event-save"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 10000
# Kalendarz zostaje przewinięty do „Dodaj wydarzenie” (koniec treści) — wiersz dnia jest wyżej.
- scrollUntilVisible:
    element: "Wywiadówka, 18:30.*"
    direction: UP
    timeout: 10000
- takeScreenshot: 04-event-form
