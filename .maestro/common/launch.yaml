# Wspólny start: czysta instalacja (świeża baza i „serwer” w pamięci), czekanie na „Moje sprawy” po pobraniu danych demo.
# Dane demo przychodzą synchronizacją z „serwera” w pamięci; „Przed chwilą” we wskaźniku (pierwszy wiersz ekranu) jest
# dopiero po udanej synchronizacji. Wcześniej start czekał na wiersz „Oddać książki do biblioteki” — przy największym
# tekście (AX5) wiersz jest poniżej ekranu i wszystkie scenariusze wariantów ax5 oblewały tutaj (nocny przebieg
# 38106362581, 11.10.2026: zrzut z kroku pokazuje nagłówek, pole dodawania i „Więcej” na całym ekranie). Wiersze danych
# sprawdza 01-today z przewijaniem. Ekran zostaje na górze — scenariusze zaczynają od pierwszego wiersza.
appId: io.github.lkarwowski494.organizer
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "screen-today"
    timeout: 60000
- extendedWaitUntil:
    visible: "Stan synchronizacji: Przed chwilą"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
