appId: io.github.lkarwowski494.organizer
name: 06 Ustawienia się otwierają
---
- runFlow: common/launch.yaml
- tapOn: "Ustawienia"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000
- assertVisible: "Ustawienia"
# Wylogowanie jest na podstronie „Konto i dane” (D131).
- tapOn: "Konto i dane"
- extendedWaitUntil:
    visible:
      id: "screen-settings-account"
    timeout: 10000
# Audyt 3 (N-74, N-75): przełącznik raportów błędów i link do polityki prywatności (strony nie otwieramy — sieć).
- scrollUntilVisible:
    element:
      id: "switch-error-reports"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "open-privacy"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
    timeout: 10000
# Audyt 3 (N-78): Licencje — lista i tekst jednej licencji.
- scrollUntilVisible:
    element: "Wróć"
    direction: UP
    timeout: 10000
- tapOn: "Wróć"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "open-licenses"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "open-licenses"
- extendedWaitUntil:
    visible:
      id: "screen-licenses"
    timeout: 10000
# Pozycja z początku listy (lista jest alfabetyczna, ponad 80 pozycji): react-native jest blisko końca i Maestro
# w 20 s przewijał tylko do ok. 20. pozycji (E2E 65, 80ef39a). Krój pisma z licencją SIL OFL, jak na ekranie.
- scrollUntilVisible:
    element:
      id: "license-@expo-google-fonts/atkinson-hyperlegible-next"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "license-@expo-google-fonts/atkinson-hyperlegible-next"
- extendedWaitUntil:
    visible:
      id: "license-text"
    timeout: 10000
- assertVisible: "@expo-google-fonts/atkinson-hyperlegible-next"
- scrollUntilVisible:
    element: "Wróć"
    direction: UP
    timeout: 10000
- tapOn: "Wróć"
- extendedWaitUntil:
    visible:
      id: "screen-licenses"
    timeout: 10000
# Zrzut ze strony głównej Ustawień (wskaźnik synchronizacji jest tylko tam).
- scrollUntilVisible:
    element: "Wróć"
    direction: UP
    timeout: 10000
- tapOn: "Wróć"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000
- scrollUntilVisible:
    element: "Ustawienia"
    direction: UP
    timeout: 10000
# Zrzut po wysłaniu zmian (wskaźnik „Przed chwilą”), nie w trakcie — powtarzalny obraz.
- extendedWaitUntil:
    visible: "Stan synchronizacji: Przed chwilą"
    timeout: 15000
- takeScreenshot: 06-settings
