appId: io.github.lkarwowski494.organizer
name: 06 Ustawienia się otwierają
---
- runFlow: common/launch.yaml
- tapOn: "Ustawienia"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000
- assertVisible: "Ustawienia"
# Wylogowanie jest na podstronie „Konto i dane” (D131).
# Po testID wiersza; przy AX5 wiersz jest poniżej ekranu (przebieg 38171092887: dotknięcie bez przewinięcia).
- scrollUntilVisible:
    element:
      id: "settings-account"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings-account"
    timeout: 10000
# Audyt 3 (N-74, N-75): przełącznik raportów błędów i link do polityki prywatności (strony nie otwieramy — sieć).
- scrollUntilVisible:
    element:
      id: "switch-error-reports"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "open-privacy"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
    timeout: 60000
# Audyt 3 (N-78): Licencje — lista i tekst jednej licencji.
- scrollUntilVisible:
    element: "Wróć"
    direction: UP
    timeout: 60000
- tapOn: "Wróć"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "open-licenses"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "open-licenses"
- extendedWaitUntil:
    visible:
      id: "screen-licenses"
    timeout: 10000
# Pozycja z początku listy (lista jest alfabetyczna, ponad 80 pozycji): react-native jest blisko końca i Maestro
# w 20 s przewijał tylko do ok. 20. pozycji (E2E 65, 80ef39a). Pierwsza pozycja, z najkrótszym tekstem na początku listy
# (licencja MIT): Maestro widzi element, gdy co najmniej 10% jego pola jest na ekranie (ViewHierarchy.filterOutOfBounds),
# a przy AX5 tekst licencji kroju pisma (MIT i SIL OFL, ok. 5500 znaków) ma kilkadziesiąt ekranów — nigdy nie był
# „widoczny” (E2E 38237288337, iPhone 17e). Tekst MIT (ok. 1100 znaków) ma przy AX5 kilka ekranów.
# Przez common/scroll-to.yaml: przy AX5 `scrollUntilVisible` minął pozycję Licencji (E2E 38220289381, iPhone 17 Pro Max).
- runFlow:
    file: common/scroll-to.yaml
    env:
      ID: "license-@babel/runtime"
- tapOn:
    id: "license-@babel/runtime"
    point: "20,10"
- extendedWaitUntil:
    visible: "@babel/runtime"
    timeout: 10000
# Przy AX5 tytuł i wersja zajmują cały ekran, tekst licencji zaczyna się niżej (E2E 38220289381, iPhone 17e) —
# wolne kroki w dół, aż tekst wejdzie na ekran.
- repeat:
    while:
      notVisible:
        id: "license-text"
    times: 10
    commands:
      - swipe:
          start: "50%, 70%"
          end: "50%, 30%"
          duration: 700
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible:
    id: "license-text"
- scrollUntilVisible:
    element: "Wróć"
    direction: UP
    timeout: 60000
- tapOn: "Wróć"
- extendedWaitUntil:
    visible:
      id: "screen-licenses"
    timeout: 10000
# Zrzut ze strony głównej Ustawień (wskaźnik synchronizacji jest tylko tam).
- scrollUntilVisible:
    element: "Wróć"
    direction: UP
    timeout: 60000
- tapOn: "Wróć"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000
- scrollUntilVisible:
    element: "Ustawienia"
    direction: UP
    timeout: 30000
# Zrzut po wysłaniu zmian (wskaźnik „Przed chwilą”), nie w trakcie — powtarzalny obraz.
- extendedWaitUntil:
    visible: "Stan synchronizacji: Przed chwilą"
    timeout: 15000
- takeScreenshot: 06-settings
