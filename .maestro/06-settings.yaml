appId: io.github.lkarwowski494.organizer
name: 06 Ustawienia się otwierają
---
- runFlow: common/launch.yaml
- tapOn: "Ustawienia"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000
- assertVisible: "Ustawienia"
# Wylogowanie jest na podstronie „Konto i dane” (D131).
# Po testID wiersza; przy AX5 wiersz jest poniżej ekranu (przebieg 38171092887: dotknięcie bez przewinięcia).
- scrollUntilVisible:
    element:
      id: "settings-account"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings-account"
    timeout: 10000
# Audyt 3 (N-74, N-75): przełącznik raportów błędów i link do polityki prywatności (strony nie otwieramy — sieć).
- scrollUntilVisible:
    element:
      id: "switch-error-reports"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "open-privacy"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
    timeout: 60000
# Audyt 3 (N-78): Licencje — lista i tekst jednej licencji.
- scrollUntilVisible:
    element: "Wróć"
    direction: UP
    timeout: 60000
- tapOn: "Wróć"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "open-licenses"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "open-licenses"
- extendedWaitUntil:
    visible:
      id: "screen-licenses"
    timeout: 10000
# Pozycja z najkrótszym tekstem licencji (SQLite, „blessing”, ok. 270 znaków). Maestro widzi element, gdy co najmniej
# 10% jego pola jest na ekranie (ViewHierarchy.filterOutOfBounds), a przy AX5 na ekran iPhone'a 17e mieści się ok. 110
# znaków tekstu: tekst kroju pisma (ok. 5500 znaków, E2E 38237288337) ani MIT (ok. 1100 znaków, E2E 38256361018 — zrzut:
# cały ekran tekstu) nigdy nie był „widoczny”. Do pozycji (blisko końca listy, ponad 80 pozycji) przez
# common/scroll-to.yaml — wolne kroki bez limitu czasu; `scrollUntilVisible` w 20 s dochodził do ok. 20. pozycji (E2E 65,
# 80ef39a), a przy AX5 mijał pozycję z rozpędem (E2E 38220289381).
- runFlow:
    file: common/scroll-to.yaml
    env:
      ID: "license-SQLite"
- tapOn:
    id: "license-SQLite"
    point: "20,10"
- extendedWaitUntil:
    visible:
      id: "screen-license"
    timeout: 10000
- assertVisible: "SQLite"
# Przy AX5 tytuł i wersja zajmują cały ekran, tekst licencji zaczyna się niżej (E2E 38220289381, iPhone 17e) —
# wolne kroki w dół, aż tekst wejdzie na ekran.
- repeat:
    while:
      notVisible:
        id: "license-text"
    times: 10
    commands:
      - swipe:
          start: "50%, 70%"
          end: "50%, 30%"
          duration: 700
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible:
    id: "license-text"
- scrollUntilVisible:
    element: "Wróć"
    direction: UP
    timeout: 60000
- tapOn: "Wróć"
- extendedWaitUntil:
    visible:
      id: "screen-licenses"
    timeout: 10000
# Zrzut ze strony głównej Ustawień (wskaźnik synchronizacji jest tylko tam).
# Lista przewinięta do SQLite (przy AX5 ok. 25 ekranów): na górę szybkimi przeciągnięciami w dół — na początku listy
# ruch z rozpędem się kończy, nic się nie mija (scrollUntilVisible w 60 s mógłby nie zdążyć).
- repeat:
    while:
      notVisible: "Wróć"
    times: 60
    commands:
      - swipe:
          start: "50%, 25%"
          end: "50%, 85%"
          duration: 300
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible: "Wróć"
- tapOn: "Wróć"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000
- scrollUntilVisible:
    element: "Ustawienia"
    direction: UP
    timeout: 30000
# Zrzut po wysłaniu zmian (wskaźnik „Przed chwilą”), nie w trakcie — powtarzalny obraz.
- extendedWaitUntil:
    visible: "Stan synchronizacji: Przed chwilą"
    timeout: 15000
- takeScreenshot: 06-settings
